# 线束管理平台 ECS 部署（与 LIMS 同机时：数据目录 /data/wire-harness，勿与 /data/lims 混用）
#
# 入口 HTTPS（与 ops.houmq.cn / houmq.cn 等同机时，勿让本 compose 占 80/443）：
#   host-nginx（默认）→ WEB_HOST_PORT=8096 + scripts/register-wire-host-nginx.sh
#   shared-caddy → scripts/register-wire-shared-caddy.sh 注册到主 LIMS Caddy
#   standalone-caddy → 仅独占 ECS 时使用；同机有主机 Nginx 时会部署失败

services:
  caddy:
    profiles: ["standalone-caddy"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.ecs:/etc/caddy/Caddyfile:ro
      - /data/wire-harness/caddy/data:/data
      - /data/wire-harness/caddy/config:/config
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    networks:
      - default

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-wire_harness}
      POSTGRES_USER: ${DB_USER:-wire_harness}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    volumes:
      - /data/wire-harness/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wire_harness} -d ${DB_NAME:-wire_harness}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: >
      redis-server
        --appendonly yes
        --maxmemory ${REDIS_MAXMEMORY:-128mb}
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    volumes:
      - /data/wire-harness/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${WIRE_HARNESS_BACKEND_IMAGE:-wire-harness-backend:ecs}
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DEPLOY_MODE: onprem
      MIGRATIONS_PATH: /app/migrations
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      UPLOAD_DIR: /app/uploads
      PASSWORD_ENCRYPT_KEY: ${PASSWORD_ENCRYPT_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://wire.houmq.cn}
    volumes:
      - /data/wire-harness/uploads:/app/uploads
      - /data/wire-harness/backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    image: ${WIRE_HARNESS_WEB_IMAGE:-wire-harness-web:ecs}
    container_name: wire-harness-web
    expose:
      - "80"
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-8096}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - lims-edge
    restart: unless-stopped

networks:
  lims-edge:
    external: true
