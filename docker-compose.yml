services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wire_harness_dev
    ports:
      - "5434:5432"
    volumes:
      - wire_harness_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - wire_harness_redis_data:/data

volumes:
  wire_harness_pg_data:
  wire_harness_redis_data:
