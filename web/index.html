<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>线束管理平台</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      .boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #eef3ff 0%, #f7f9ff 45%, #eaf1ff 100%);
        color: #334155;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .boot-shell__card {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 10px 30px rgba(30, 41, 59, 0.08);
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
      }
      .boot-shell__spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(15, 23, 42, 0.2);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: boot-spin 0.75s linear infinite;
      }
      @keyframes boot-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <div class="boot-shell__card">
          <span class="boot-shell__spinner" aria-hidden="true"></span>
          <span>正在启动线束管理平台...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
